<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>GameHub</h1>
        <p>Your Game Collection</p>

    <main>

    </main>

    <footer>
        <p>© 2026 GameHub</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
