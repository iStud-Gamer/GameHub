<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameHub</title>

    <meta
        name="description"
        content="Discover and download your favorite games."
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!-- HEADER -->

    <header class="site-header">

        <div class="header-inner">

            <a
                href="./"
                class="logo"
            >
                ◈ GameHub
            </a>

        </div>

    </header>



    <!-- HERO -->

    <section class="hero">

        <h1>
            GameHub
        </h1>

        <p>
            Discover and download your favorite games.
        </p>

    </section>



    <!-- GAMES -->

    <main class="container">

        <div class="section-header">

            <h2>
                Games
            </h2>

            <span id="game-count">
                0 games
            </span>

        </div>


        <div id="games">

            <p class="loading">
                Loading games...
            </p>

        </div>

    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            GameHub
        </p>

        <p>
            Discover. Download. Play.
        </p>

        <p>
            © 2026 GameHub
        </p>

    </footer>



    <script
        type="module"
        src="./script.js"
    ></script>

</body>

</html>
