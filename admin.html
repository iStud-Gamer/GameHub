<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GameHub Admin</title>

    <link
    rel="stylesheet"
    href="./admin-style.css"
>

</head>


<body>

    <main class="admin-container">

        <!-- HEADER -->

        <div class="admin-header">

            <h1>GameHub Admin</h1>

            <p>Manage your games</p>

        </div>


        <!-- LOGIN -->

        <section
            id="login-section"
            class="admin-box"
        >

            <h2>Admin Login</h2>


            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
            >


            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >


            <button id="login-btn">
                Login
            </button>


            <p id="login-message"></p>

        </section>



        <!-- ADMIN PANEL -->

        <section
            id="admin-section"
            style="display: none;"
        >


            <!-- ADD GAME -->

            <div class="admin-box">

                <div class="admin-top">

                    <h2>Add Game</h2>


                    <button
                        id="logout-btn"
                        class="logout-btn"
                    >
                        Logout
                    </button>

                </div>


                <input
                    type="text"
                    id="game-name"
                    placeholder="Game name"
                >


                <input
                    type="text"
                    id="game-version"
                    placeholder="Version"
                >


                <textarea
                    id="game-description"
                    placeholder="Game description"
                ></textarea>


                <input
                    type="url"
                    id="game-icon"
                    placeholder="Game icon URL"
                >


                <input
                    type="url"
                    id="game-download"
                    placeholder="Download URL"
                >


                <button id="add-game-btn">
                    Add Game
                </button>


                <p id="game-message"></p>

            </div>



            <!-- EDIT GAME -->

            <div
                id="edit-section"
                class="admin-box edit-section"
                style="display: none;"
            >

                <div class="admin-top">

                    <h2>Edit Game</h2>


                    <button
                        id="cancel-edit-btn"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                </div>


                <label>
                    Game Name
                </label>


                <input
                    type="text"
                    id="edit-game-name"
                    placeholder="Game name"
                >


                <label>
                    Version
                </label>


                <input
                    type="text"
                    id="edit-game-version"
                    placeholder="Version"
                >


                <label>
                    Description
                </label>


                <textarea
                    id="edit-game-description"
                    placeholder="Game description"
                ></textarea>


                <label>
                    Icon URL
                </label>


                <input
                    type="url"
                    id="edit-game-icon"
                    placeholder="Game icon URL"
                >


                <div class="edit-preview">

                    <img
                        id="edit-preview-image"
                        src=""
                        alt="Game icon preview"
                    >

                </div>


                <label>
                    Download URL
                </label>


                <input
                    type="url"
                    id="edit-game-download"
                    placeholder="Download URL"
                >


                <button id="save-edit-btn">
                    Save Changes
                </button>


                <p id="edit-message"></p>

            </div>



            <!-- EXISTING GAMES -->

            <div
                id="games-section"
                class="admin-box"
            >

                <div class="admin-top">

                    <h2>
                        Existing Games
                    </h2>


                    <span id="admin-game-count">
                    </span>

                </div>


                <div id="admin-games">

                    <p>
                        Loading games...
                    </p>

                </div>

            </div>


        </section>

    </main>



    <!-- IMPORTANT -->

    <script
        type="module"
        src="./admin.js"
    ></script>


</body>

</html>
